<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Faça seu login no Tieltter, uma rede social">
    <title>Tieltter - Login</title>
    <link rel="stylesheet" href="../resources/css/style.css">
</head>

<body>
    <main>
        <div class="box1">
            <img id="logo-login" src="https://placehold.co/600x600" alt="logo tieltter">
        </div>
        <div class="box1">
            <div>
                <h1>Veja oque está acontecendo</h1>
            </div>
            <div>
                <form>
                    <input type="text" placeholder="E-mail ou nome de usuário">
                    <input type="password" placeholder="Senha">
                    <div id="login-button-container">
                        <button type="submit" id="join">Entrar</button>
                        <button type="reset">Limpar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>© 2026 Tieltter - Nenhum direito reservado</p>
    </footer>
</body>
<script>
    const buttonJoin = document.getElementById('join');
    buttonJoin.addEventListener('click', function(event) {
        event.preventDefault();
        window.location.href = './portal.html';
    });
    // COLOQUEI ISSO SÓ PRA FACILITAR O TESTE E NAVEGAÇÃO
</script>
</html>
